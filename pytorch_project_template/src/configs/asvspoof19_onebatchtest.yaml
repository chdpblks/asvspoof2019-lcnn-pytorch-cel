defaults:
  - model: light_cnn
  - writer: cometml
  - metrics: asvspoof
  - datasets: asvspoof19_onebatchtest
  - dataloader: audio
  - transforms: lfcc
  - _self_
optimizer:
  _target_: torch.optim.Adam
  lr: 0.0001
  betas: [0.9, 0.98]
  eps: 1.0e-9
  weight_decay: 0.0001
lr_scheduler:
  _target_: torch.optim.lr_scheduler.CosineAnnealingLR
  T_max: 100
  eta_min: 1e-6  
loss_function:
  _target_: src.loss.ASVSpoofLoss
  class_weights: [1.0, 8.837]
trainer:
  log_step: 5
  n_epochs: 100
  epoch_len: null
  device_tensors: ["data_object", "labels"]
  resume_from: null
  device: auto
  override: False
  monitor: "min test_EER"
  save_period: 20
  early_stop: ${trainer.n_epochs}
  save_dir: "saved"
  seed: 42